name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "3.4"

      - name: Install Cookstyle
        run: gem install --no-document cookstyle -v 8.6.10

      - name: Tests
        run: rake test

      - name: Cookstyle
        run: cookstyle --fail-level R
